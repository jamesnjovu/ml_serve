name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: "1.18.4"
          otp-version: "26.2.5"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-lint-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-lint-${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get
      - run: mix deps.unlock --check-unused
      - run: mix lint
      - run: mix deps.audit

      - name: Docs must be warning-free
        env:
          MIX_ENV: dev
        run: |
          mix deps.get
          output="$(mix docs 2>&1)"
          echo "$output"
          if echo "$output" | grep -q "warning:"; then
            echo "::error::mix docs emitted warnings"
            exit 1
          fi

      - uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-${{ steps.beam.outputs.otp-version }}-

      - run: mix dialyzer --format github

  test:
    name: Test
    uses: ./.github/workflows/test-matrix.yml

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "26.2.5"

      # README, llms.txt and usage-rules.md all tell readers — and coding agents — that this code
      # is verified. That claim decays silently on the first API change unless something runs it.
      - name: Run every example script
        run: |
          set -e
          for script in examples/scripts/*.exs; do
            echo "::group::$script"
            elixir "$script"
            echo "::endgroup::"
          done

      - name: The example service must build and pass its own suite
        working-directory: examples/inference_service
        run: |
          mix deps.get
          MIX_ENV=test mix test

      # examples/onnx is deliberately excluded: Ortex needs a Rust toolchain and
      # sentence_embeddings.exs downloads 90 MB from HuggingFace. Those belong in a scheduled
      # job, not on every push.

  package:
    name: Package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "26.2.5"

      - run: mix deps.get
      - run: mix hex.build --unpack -o /tmp/pkg

      # The `files:` allowlist in mix.exs is easy to break silently. Assert it directly.
      - name: Assert the tarball contents
        run: |
          set -e
          for forbidden in test config .github priv/plts doc dev examples; do
            if [ -e "/tmp/pkg/$forbidden" ]; then
              echo "::error::$forbidden was published but should be excluded"
              exit 1
            fi
          done

          for required in lib mix.exs README.md CHANGELOG.md LICENSE .formatter.exs \
                          usage-rules.md llms.txt guides/getting-started.md \
                          guides/creating-a-backend.md guides/production-deployment.md; do
            if [ ! -e "/tmp/pkg/$required" ]; then
              echo "::error::$required is missing from the package"
              exit 1
            fi
          done

          echo "Package contents verified."
          find /tmp/pkg -maxdepth 2 | sort
