name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: "1.18.4"
          otp-version: "26.2.5"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-lint-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-lint-${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get
      - run: mix deps.unlock --check-unused
      - run: mix lint
      - run: mix deps.audit

      - name: Docs must be warning-free
        env:
          MIX_ENV: dev
        run: |
          mix deps.get
          output="$(mix docs 2>&1)"
          echo "$output"
          if echo "$output" | grep -q "warning:"; then
            echo "::error::mix docs emitted warnings"
            exit 1
          fi

      - uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-${{ steps.beam.outputs.otp-version }}-

      - run: mix dialyzer --format github

  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Floor of the `elixir: "~> 1.14"` requirement in mix.exs. If this row goes red, either
          # fix it or raise the requirement — do not just drop it.
          - elixir: "1.14.5"
            otp: "25.3"
          - elixir: "1.15.8"
            otp: "26.2.5"
          - elixir: "1.16.3"
            otp: "26.2.5"
          - elixir: "1.17.3"
            otp: "27.2"
          - elixir: "1.18.4"
            otp: "27.2"
          # Canary: latest everything with the lock file ignored, so an upstream release that
          # breaks us shows up here rather than in someone's `mix deps.update`.
          - elixir: "1.18.4"
            otp: "27.2"
            unlocked: true
    continue-on-error: ${{ matrix.unlocked == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: actions/cache@v4
        if: ${{ !matrix.unlocked }}
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-test-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}

      - name: Unlock dependencies
        if: ${{ matrix.unlocked }}
        run: rm -f mix.lock

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test

      # The suite is fully async and exercises worker crashes, drains and canary splits. Running
      # it repeatedly is how a race that only shows up one run in twenty gets caught here rather
      # than in someone's CI.
      - name: Stress the suite for flakiness
        if: ${{ matrix.elixir == '1.18.4' && !matrix.unlocked }}
        run: mix test --repeat-until-failure 20

  package:
    name: Package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "26.2.5"

      - run: mix deps.get
      - run: mix hex.build --unpack -o /tmp/pkg

      # The `files:` allowlist in mix.exs is easy to break silently. Assert it directly.
      - name: Assert the tarball contents
        run: |
          set -e
          for forbidden in test config .github priv/plts doc dev; do
            if [ -e "/tmp/pkg/$forbidden" ]; then
              echo "::error::$forbidden was published but should be excluded"
              exit 1
            fi
          done

          for required in lib mix.exs README.md CHANGELOG.md LICENSE .formatter.exs \
                          usage-rules.md llms.txt guides/getting-started.md \
                          guides/creating-a-backend.md guides/production-deployment.md; do
            if [ ! -e "/tmp/pkg/$required" ]; then
              echo "::error::$required is missing from the package"
              exit 1
            fi
          done

          echo "Package contents verified."
          find /tmp/pkg -maxdepth 2 | sort
